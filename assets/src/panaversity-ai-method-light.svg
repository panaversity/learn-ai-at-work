<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 216' width='760' height='216' role='img' aria-labelledby='t d' font-family='Inter, sans-serif' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><title id='t'>The Panaversity AI Method</title><desc id='d'>The Panaversity AI Method: you define the work, AI does it, you decide when it is done. Five steps in a row. Step 1, define the problem: done by you. Step 2, set up the environment: done by you, with Claude. Step 3, write the four-part brief: done by you. Step 4, improve with the Dr. Gilsdorf method: done by Claude and a second AI, in rounds until 9.5. Step 5, check and commit: you decide.</desc><rect width='760' height='216' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a9a69b'/></marker></defs><text x='24' y='34' font-size='15' font-weight='600' fill='#1f1f1d' text-anchor='start'>You define the work, AI does it, you decide when it is done</text><path d='M158.0 104H170.0' fill='none' stroke='#a9a69b' stroke-width='1.25' marker-end='url(#a)'/><path d='M302.0 104H314.0' fill='none' stroke='#a9a69b' stroke-width='1.25' marker-end='url(#a)'/><path d='M446.0 104H458.0' fill='none' stroke='#a9a69b' stroke-width='1.25' marker-end='url(#a)'/><path d='M590.0 104H602.0' fill='none' stroke='#a9a69b' stroke-width='1.25' marker-end='url(#a)'/><path d='M504 148V172H544V148' fill='none' stroke='#a9a69b' stroke-width='1.25' marker-end='url(#a)'/><rect x='26.0' y='60' width='132' height='88' rx='8' fill='#ffffff' stroke='#a9a69b' stroke-width='1.25'/><text x='92' y='82' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>1</text><text x='92' y='104' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>Define the</text><text x='92' y='120' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>problem</text><text x='92' y='139' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>You</text><rect x='170.0' y='60' width='132' height='88' rx='8' fill='#ffffff' stroke='#a9a69b' stroke-width='1.25'/><text x='236' y='82' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>2</text><text x='236' y='104' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>Set up the</text><text x='236' y='120' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>environment</text><text x='236' y='139' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>You, with Claude</text><rect x='314.0' y='60' width='132' height='88' rx='8' fill='#ffffff' stroke='#a9a69b' stroke-width='1.25'/><text x='380' y='82' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>3</text><text x='380' y='104' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>Write the</text><text x='380' y='120' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>four-part brief</text><text x='380' y='139' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>You</text><rect x='458.0' y='60' width='132' height='88' rx='8' fill='#ffffff' stroke='#a9a69b' stroke-width='1.25'/><text x='524' y='82' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>4</text><text x='524' y='104' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>Improve with</text><text x='524' y='120' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>Dr. Gilsdorf</text><text x='524' y='139' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>Claude + 2nd AI</text><rect x='602.0' y='60' width='132' height='88' rx='8' fill='#e6f0fb' stroke='#1f6fd1' stroke-width='2'/><text x='668' y='82' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>5</text><text x='668' y='104' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>Check and</text><text x='668' y='120' font-size='12.5' font-weight='600' fill='#1f1f1d' text-anchor='middle'>commit</text><text x='668' y='139' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>You decide</text><text x='524' y='192' font-size='11.5' font-weight='400' fill='#5f5e5a' text-anchor='middle'>rounds until 9.5</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>