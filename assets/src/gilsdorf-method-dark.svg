<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The Dr. Gilsdorf method</title>
<desc id="d">Start with your draft. Ask the best AI you have to run the checks, such as every figure matching its source, and grade the work out of 10. Improve it in one small step, then check and grade again, and repeat until every check passes and the grade reaches 9.5. Then give the work to a different AI for an independent review, without the first AI’s grades, paste that review back into your first AI, fix what is right and run the checks again. You check the facts and read every change before you commit it. A failed check always outweighs a grade.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb5a1"/></marker></defs>
<rect width="1200" height="390" rx="18" fill="#0f1914"/>
<rect x="0.75" y="0.75" width="1198.5" height="388.5" rx="18" fill="none" stroke="#2c4437" stroke-width="1.5"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0">
<text x="40" y="38" font-size="14" font-weight="700" fill="#7fe0b0" text-anchor="start">THE DR. GILSDORF METHOD: IMPROVE IN SMALL ROUNDS</text>
<rect x="40" y="140" width="166" height="168" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="40" y="152" width="5" height="144" rx="2.5" fill="#8a9a91"/>
<text x="62" y="172" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">Your draft</text>
<text x="62" y="198" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">The memo, brief</text>
<text x="62" y="218" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">or summary you</text>
<text x="62" y="238" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">made.</text>
<path d="M209 224.0 L226 224.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="231" y="140" width="166" height="168" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="231" y="152" width="5" height="144" rx="2.5" fill="#3ddc97"/>
<text x="253" y="172" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">Review and</text>
<text x="253" y="194" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">grade</text>
<text x="253" y="220" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">The best AI</text>
<text x="253" y="240" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">runs the checks</text>
<text x="253" y="260" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">and grades it</text>
<text x="253" y="280" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">out of 10.</text>
<path d="M400 224.0 L417 224.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="422" y="140" width="166" height="168" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="422" y="152" width="5" height="144" rx="2.5" fill="#3ddc97"/>
<text x="444" y="172" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">Improve a</text>
<text x="444" y="194" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">little</text>
<text x="444" y="220" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">Ask for only</text>
<text x="444" y="240" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">the changes you</text>
<text x="444" y="260" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">agree with.</text>
<path d="M591 224.0 L608 224.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="613" y="140" width="166" height="168" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="613" y="152" width="5" height="144" rx="2.5" fill="#9aa6ff"/>
<text x="635" y="172" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">A different</text>
<text x="635" y="194" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">AI</text>
<text x="635" y="220" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">Reviews it</text>
<text x="635" y="240" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">without the</text>
<text x="635" y="260" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">first AI’s</text>
<text x="635" y="280" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">grades.</text>
<path d="M782 224.0 L799 224.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="804" y="140" width="166" height="168" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="804" y="152" width="5" height="144" rx="2.5" fill="#9aa6ff"/>
<text x="826" y="172" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">Bring it back</text>
<text x="826" y="198" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">Paste it back.</text>
<text x="826" y="218" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">Fix what is</text>
<text x="826" y="238" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">right, then</text>
<text x="826" y="258" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">check again.</text>
<path d="M973 224.0 L990 224.0" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="995" y="140" width="166" height="168" rx="14" fill="#17261e" fill-opacity="1" stroke="#2c4437" stroke-width="1.5"/>
<rect x="995" y="152" width="5" height="144" rx="2.5" fill="#f4c15d"/>
<text x="1017" y="172" font-size="18" font-weight="700" fill="#eef6f1" text-anchor="start">You keep it</text>
<text x="1017" y="198" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">Check the</text>
<text x="1017" y="218" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">facts, read</text>
<text x="1017" y="238" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">every change,</text><text x="1017" y="258" font-size="15" font-weight="400" fill="#aec3b6" text-anchor="start">then commit.</text>
<path d="M505.0 137 L505.0 96 L314.0 96 L314.0 135" fill="none" stroke="#8fb5a1" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="409.5" y="86" font-size="15" font-weight="600" fill="#aec3b6" text-anchor="middle">repeat until 9.5 and every check passes</text>
<text x="40" y="352" font-size="16" font-weight="600" fill="#aec3b6" text-anchor="start">Iteration is the key: many small, checked steps beat one big rewrite. A failed check always outweighs a grade.</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
